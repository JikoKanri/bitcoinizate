<head>

    <title>Choppy Bitcoin | Bitcoinizate</title>
    <!-- Enlace al laboratorio visual externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="score-display" class="ui-text">SCORE: 0</div>

        <div id="cold-storage-display" class="ui-text">COLD STORAGE: 0</div>
        
        <!-- Capa interactiva de menú arcade -->

            <div id="menu-text">
                CHOPPY BITCOIN<br><br>
                <span style="color:#FFF; font-size:0.85rem;">SURVIVE THE MARKET</span>

            <button class="btn-start" id="start-trigger">START GAME</button>
        </div>

        <div id="version-display">v1.9.0-modular</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <a href="../index.html" class="btn-back"><- BACK TO MENU</a>
