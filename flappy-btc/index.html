<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bitcoin | Bitcoinizate</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: rgba(0,0,0,0); 
        }
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 400px;
            height: 75vh;
            max-height: 600px;
            border: 4px solid #F2A900;
            background: #111;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(242, 169, 0, 0.4);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(#0b0b1a, #111122);
            transform: translateZ(0);
        }

        .bear-mode {
            animation: screenShake 0.15s infinite;
            filter: cubic-bezier(0.1, 0.7, 1.0, 0.1) hue-rotate(-50deg) contrast(170%) saturate(200%);
            border-color: #FF3333 !important;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.6) !important;
        }

        .ui-text {
            position: absolute;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        
        #score-display { 
            top: 20px; 
            font-size: 1rem; 
            color: #00FF66; 
            text-shadow: 2px 2px #000; 
        }

        #status-display {
            top: 55px;
            font-size: 0.55rem;
            text-shadow: 1px 1px #000;
        }
        
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 26, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }

        #menu-text {
            font-size: 0.7rem;
            line-height: 2;
            color: #F2A900;
            text-align: center;
            text-shadow: 2px 2px #000;
            margin-bottom: 30px;
        }

        .btn-start {
            background: #00FF66;
            color: #000;
            border: none;
            padding: 15px 25px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #00aa44;
        }

        #version-display {
            position: absolute;
            bottom: 12px;
            right: 15px;
            font-size: 0.45rem;
            color: #444;
            text-align: right;
            z-index: 12;
            pointer-events: none;
        }
        
        .btn-back {
            margin-top: 20px;
            padding: 12px 24px;
            background: #1A1A1A;
            color: #F2A900;
            border: 3px solid #F2A900;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            text-decoration: none;
            cursor: pointer;
        }
        
        .btn-back:hover { 
            background: #F2A900; 
            color: #000; 
        }

        @keyframes screenShake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-display" class="ui-text">SCORE: 0</div>
        <div id="status-display" class="ui-text"></div>
        
        <div id="menu-overlay">
            <div id="menu-text">
                FLAPPY BITCOIN<br><br>
                <span style="color:#FFF; font-size:0.52rem;">SURVIVE THE MARKET</span>
            </div>
            <button class="btn-start" id="start-trigger">START GAME</button>
        </div>

        <div id="version-display">v1.2.5-final</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <a href="../index.html" class="btn-back"><- BACK TO MENU</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("game-container");
        const scoreDisplay = document.getElementById("score-display");
        const statusDisplay = document.getElementById("status-display");
        const menuOverlay = document.getElementById("menu-overlay");
        const startTrigger = document.getElementById("start-trigger");
        const versionDisplay = document.getElementById("version-display");

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        let gameState = "MENU"; 
        let score = 0;
        let highscore = 0;
        let activePower = "NONE"; 
        let powerTimer = 0;

        const btc = { x: 60, y: 250, radius: 18, velocity: 0, gravity: 0.38, jump: -6.8 };
        let pipes = [];
        let items = [];
        const pipeWidth = 65;
        let pipeGap = 160;
        let baseSpeed = 2.6;
        let pipeTimer = 0;

        function resetGame() {
            btc.y = 250; 
            btc.velocity = 0; 
            pipes = []; 
            items = []; 
            score = 0; 
            pipeTimer = 0;
            activePower = "NONE"; 
            powerTimer = 0;
            container.classList.remove("bear-mode");
            scoreDisplay.innerText = "SCORE: 0";
            statusDisplay.innerText = "";
            versionDisplay.style.color = "#444";
        }

        function startGame() {
            initAudio();
            gameState = "PLAYING";
            menuOverlay.style.display = "none";
            resetGame();
            playTone(440, "sine", 0.1);
        }

        function gameOver() {
            gameState = "GAMEOVER";
            playTone(120, "sawtooth", 0.5); 
            if(score > highscore) highscore = score;
            
            document.getElementById("menu-text").innerHTML = "REKT!<br><br><span style='color:#FFF; font-size:0.55rem;'>LIQUIDATED</span><br><br>SCORE: " + score + "<br>TOP SCORE: " + highscore;
            startTrigger.innerText = "RESTART";
            menuOverlay.style.display = "flex";
            
            container.classList.remove("bear-mode");
            versionDisplay.style.color = "#444";
        }

        function jump() {
            if (gameState === "PLAYING") {
                btc.velocity = btc.jump;
                playTone(420, "square", 0.07); 
            }
        }

        function triggerAction(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (gameState === "MENU" || gameState === "GAMEOVER") {
                startGame();
            } else if (gameState === "PLAYING") {
                jump();
            }
        }

        startTrigger.addEventListener("click", triggerAction);
        startTrigger.addEventListener("touchstart", triggerAction, { passive: false });

        window.addEventListener("keydown", (e) => { 
            if (e.code === "Space" || e.key === " " || e.code === "ArrowUp" || e.key === "w" || e.key === "W") { 
                e.preventDefault(); 
                if (gameState === "PLAYING") jump(); 
            } 
        }, { capture: true });
        
        container.addEventListener("touchstart", (e) => { 
            e.preventDefault(); 
            if (gameState === "PLAYING") jump(); 
        }, { passive: false });
        
        container.addEventListener("mousedown", (e) => { 
            e.preventDefault(); 
            if (gameState === "PLAYING") jump(); 
        });

        function update() {
            if (gameState === "PLAYING") {
                let currentSpeed = baseSpeed;

                            pipeGap = 160;
                
                if (activePower !== "NONE") {
                    powerTimer--;
                    let secondsLeft = Math.ceil(powerTimer / 60);
                    
                    if (activePower === "BULL") {
                        statusDisplay.innerText = "BULL RUN! (" + secondsLeft + "s)";
                        statusDisplay.style.color = "#00FF66";
                        versionDisplay.style.color = "rgba(0, 255, 102, 0.3)";
                    } else if (activePower === "LASER") {
                        currentSpeed = baseSpeed * 0.5;
                        statusDisplay.innerText = "LASER EYES! (" + secondsLeft + "s)";
                        statusDisplay.style.color = "#33CCFF";
                        versionDisplay.style.color = "rgba(51, 204, 255, 0.3)";
                    } else if (activePower === "BEAR") {
                        currentSpeed = baseSpeed * 1.35;
                        statusDisplay.innerText = "BEAR CRASH! (" + secondsLeft + "s)";
                        statusDisplay.style.color = "#FF3333";
                        versionDisplay.style.color = "rgba(255, 51, 51, 0.4)";
                    }
                    
                    if (powerTimer <= 0) {
                        activePower = "NONE";
                        container.classList.remove("bear-mode");
                        statusDisplay.innerText = "";
                        versionDisplay.style.color = "#444";
                    }
                }

                btc.velocity += btc.gravity;
                btc.y += btc.velocity;

                if (btc.y + btc.radius > canvas.height || btc.y - btc.radius < 0) {
                    gameOver();
                }

                pipeTimer++;
                if (pipeTimer % 95 === 0) {
                    let minHeight = 60;
                    let maxHeight = canvas.height - pipeGap - 60;
                    let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                    
                    pipes.push({ 
                        x: canvas.width, 
                        top: topHeight, 
                        bottom: canvas.height - (topHeight + pipeGap), 
                        passed: false 
                    });

                    if (Math.random() < 0.45) {
                        let rand = Math.random();
                        let itemType = "BULL";
                        if (rand > 0.33 && rand < 0.66) itemType = "LASER";
                        if (rand >= 0.66) itemType = "BEAR";

                        items.push({
                            x: canvas.width + pipeWidth + 30,
                            y: topHeight + pipeGap / 2,
                            type: itemType,
                            radius: 14
                        });
                    }
                }

                for (let j = items.length - 1; j >= 0; j--) {
                    items[j].x -= currentSpeed;
                    let dist = Math.hypot(btc.x - items[j].x, btc.y - items[j].y);
                    
                    if (dist < btc.radius + items[j].radius) {
                        activePower = items[j].type;
                        powerTimer = 360;
                        
                        if (activePower === "BULL") {
                            playTone(550, "sine", 0.15);
                            setTimeout(() => playTone(850, "sine", 0.2), 60);
                        } else if (activePower === "LASER") {
                            playTone(480, "triangle", 0.25);
                        } else if (activePower === "BEAR") {
                            playTone(160, "sawtooth", 0.45);
                            container.classList.add("bear-mode");
                        }
                        items.splice(j, 1);
                        continue;
                    }
                    if (items[j].x < -20) items.splice(j, 1);
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= currentSpeed;

                    if (activePower !== "BULL") {
                        if (
                            btc.x + btc.radius - 3 > pipes[i].x &&
                            btc.x - btc.radius + 3 < pipes[i].x + pipeWidth &&
                            (btc.y - btc.radius + 3 < pipes[i].top || btc.y + btc.radius - 3 > canvas.height - pipes[i].bottom)
                        ) {
                            gameOver();
                        }
                    }

                    if (!pipes[i].passed && pipes[i].x + pipeWidth < btc.x) {
                        pipes[i].passed = true;
                        score += (activePower === "BULL") ? 2 : 1; 
                        scoreDisplay.innerText = "SCORE: " + score;
                        playTone(880, "sine", 0.04); 
                    }
                    if (pipes[i].x + pipeWidth < 0) pipes.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = (activePower === "BEAR") ? "#351212" : "#121226";
            ctx.lineWidth = 1;
            
            for(let i = 0; i < canvas.width; i += 40) { 
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); 
            }
            for(let j = 0; j < canvas.height; j += 40) { 
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke(); 
            }

            pipes.forEach(p => {
                ctx.fillStyle = (activePower === "BULL") ? "#00FF66" : "#FF3333";
                ctx.fillRect(p.x, 0, pipeWidth, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, pipeWidth, p.bottom);
                
                ctx.strokeStyle = "#FFFFFF"; 
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, 0, pipeWidth, p.top);
                ctx.strokeRect(p.x, canvas.height - p.bottom, pipeWidth, p.bottom);
            });

            items.forEach(it => {
                ctx.beginPath(); 
                ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
                if (it.type === "BULL") ctx.fillStyle = "#00FF66";
                if (it.type === "LASER") ctx.fillStyle = "#33CCFF";
                if (it.type === "BEAR") ctx.fillStyle = "#FF3333";
                ctx.fill(); ctx.strokeStyle = "#FFF"; ctx.lineWidth = 2; ctx.stroke();
                
                ctx.fillStyle = "#000"; 
                ctx.font = "bold 12px monospace"; 
                ctx.textAlign = "center"; 
                ctx.textBaseline = "middle";
                let sym = it.type === "BULL" ? "▲" : it.type === "LASER" ? "🕶" : "▼";
                ctx.fillText(sym, it.x, it.y);
            });

            ctx.beginPath(); 
            ctx.arc(btc.x, btc.y, btc.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#F2A900"; 
            ctx.fill(); 
            ctx.strokeStyle = "#FFFFFF"; 
            ctx.lineWidth = 3; 
            ctx.stroke();
            
            ctx.fillStyle = "#FFFFFF"; 
            ctx.font = "bold 18px monospace"; 
            ctx.textAlign = "center"; 
            ctx.textBaseline = "middle";
            ctx.fillText("₿", btc.x, btc.y + 1);
        }

        function loop() { 
            update(); 
            draw(); 
            requestAnimationFrame(loop); 
        }
        
        loop();
