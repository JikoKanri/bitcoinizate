<!-- PARTE 1 DE 3: ESTRUCTURA HTML Y ESTILOS CSS DINÁMICOS -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bitcoin | Bitcoinizate</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: rgba(0,0,0,0); 
        }
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 400px;
            height: 75vh;
            max-height: 600px;
            border: 4px solid #F2A900;
            background: #111;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(242, 169, 0, 0.4);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(#0b0b1a, #111122);
            transform: translateZ(0);
        }
        .bear-mode {
            animation: screenShake 0.15s infinite;
            filter: cubic-bezier(0.1, 0.7, 1.0, 0.1) hue-rotate(-50deg) contrast(170%) saturate(200%);
            border-color: #FF3333 !important;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.6) !important;
        }
        .bull-mode {
            filter: hue-rotate(90deg) contrast(150%) saturate(180%);
            border-color: #00FF66 !important;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.6) !important;
        }

    <!-- PARTE 2 DE 3: INTERFAZ ARCADE Y SECUENCIADOR MUSICAL COMPLETO -->
        .ui-text {
            position: absolute;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 1px;
        }
        #score-display { top: 20px; font-size: 1.4rem; color: #00FF66; text-shadow: 2px 2px #000; }
        #status-display { top: 55px; font-size: 0.9rem; text-shadow: 1px 1px #000; }
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }
        #menu-text { font-size: 1.1rem; line-height: 1.8; color: #F2A900; text-align: center; text-shadow: 2px 2px #000; margin-bottom: 30px; }
        .btn-start {
            background: #00FF66; color: #000; border: none; padding: 15px 30px;
            font-family: 'Courier New', Courier, monospace; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #00aa44;
        }
        #version-display { position: absolute; bottom: 15px; right: 15px; font-size: 0.95rem; color: #F2A900; text-align: right; z-index: 12; pointer-events: none; text-shadow: 1px 1px #000; }
        .btn-back { margin-top: 20px; padding: 12px 24px; background: #1A1A1A; color: #F2A900; border: 3px solid #F2A900; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; text-decoration: none; cursor: pointer; }
        .btn-back:hover { background: #F2A900; color: #000; }
        @keyframes screenShake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display" class="ui-text">SCORE: 0</div>
        <div id="status-display" class="ui-text"></div>
        <div id="menu-overlay">
            <div id="menu-text">FLAPPY BITCOIN<br><br><span style="color:#FFF; font-size:0.85rem;">SURVIVE THE MARKET</span></div>
            <button class="btn-start" id="start-trigger">START GAME</button>
        </div>
        <div id="version-display">v1.5.5-audio-fixed</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
    <a href="../index.html" class="btn-back"><- BACK TO MENU</a>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("game-container");
        const scoreDisplay = document.getElementById("score-display");
        const statusDisplay = document.getElementById("status-display");
        const menuOverlay = document.getElementById("menu-overlay");
        const startTrigger = document.getElementById("start-trigger");
        const versionDisplay = document.getElementById("version-display");

        let audioCtx = null;
        let musicInterval = null;
        let musicStep = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.08) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = type; osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function startMusicSequencer() {
            if (musicInterval) clearInterval(musicInterval);
            musicInterval = setInterval(() => {
                if (gameState !== "PLAYING") return;
                
                // NOTAS CORREGIDAS EN ESCALAS REALES (FRECUENCIAS HZ)
                if (activePower === "BEAR") {
                    let bearNotes =; // Fúnebre y grave
                    playTone(bearNotes[musicStep % 8], "sawtooth", 0.22, 0.05);
                } else if (activePower === "BULL") {
                    let bullNotes =; // Frenética y alegre (escala mayor)
                    playTone(bullNotes[musicStep % 8], "square", 0.12, 0.04);
                } else {
                    let normalNotes =; // Neutra arpegiada estilo retro
                    playTone(normalNotes[musicStep % 8], "sine", 0.18, 0.05);
                }
                musicStep++;
            }, 220); 
        }

        let gameState = "MENU"; let score = 0; let highscore = 0;
        let activePower = "NONE"; let laserActive = false; let powerTimer = 0; let laserTimer = 0;
        const btc = { x: 60, y: 250, radius: 18, velocity: 0, gravity: 0.38, jump: -6.8 };
        let pipes = []; let items = []; const pipeWidth = 65; let pipeGap = 160; let baseSpeed = 2.6; let pipeTimer = 0;
        let animatedWidthWidth = 65; 
// PARTE 3 DE 3: LOGÍCA DE COLISIONES, INMUNIDAD CON VELOCIDAD Y CIERRE
        function resetGame() {
            btc.y = 250; btc.velocity = 0; pipes = []; items = []; score = 0; pipeTimer = 0;
            activePower = "NONE"; laserActive = false; powerTimer = 0; laserTimer = 0;
            container.className = ""; scoreDisplay.innerText = "SCORE: 0"; statusDisplay.innerText = "";
        }
        function startGame() { initAudio(); resetGame(); menuOverlay.style.display = "none"; gameState = "PLAYING"; playTone(440, "sine", 0.1); startMusicSequencer(); }
        function gameOver() {
            gameState = "GAMEOVER"; if(musicInterval) clearInterval(musicInterval); playTone(120, "sawtooth", 0.5); if(score > highscore) highscore = score;
            document.getElementById("menu-text").innerHTML = "REKT!<br><br><span style='color:#FFF; font-size:0.9rem;'>LIQUIDATED</span><br><br>SCORE: " + score + "<br>TOP SCORE: " + highscore;
            startTrigger.innerText = "RESTART"; menuOverlay.style.display = "flex"; container.className = "";
        }
        function jump() { if (gameState === "PLAYING") { btc.velocity = btc.jump; playTone(420, "square", 0.07); } }
        function triggerAction(e) { if (e) { e.preventDefault(); e.stopPropagation(); } if (gameState === "MENU" || gameState === "GAMEOVER") startGame(); else if (gameState === "PLAYING") jump(); }

        startTrigger.addEventListener("click", triggerAction); startTrigger.addEventListener("touchstart", triggerAction, { passive: false });
        window.addEventListener("keydown", (e) => { if (e.code === "Space" || e.key === " " || e.code === "ArrowUp" || e.key === "w" || e.key === "W") { e.preventDefault(); jump(); } }, { capture: true });
        container.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); }, { passive: false }); container.addEventListener("mousedown", (e) => { e.preventDefault(); jump(); });

        function update() {
            if (gameState === "PLAYING") {
                let currentSpeed = baseSpeed;
                
                // --- PROCESAMIENTO DE COMBOS Y COEXISTENCIA ---
                let statusText = "";
                if (activePower === "BULL") { currentSpeed = baseSpeed * 1.45; container.className = "bull-mode"; statusText += "BULL RUN(" + Math.ceil(powerTimer/60) + "s) "; powerTimer--; if(powerTimer<=0) { activePower="NONE"; container.className=""; } }
                else if (activePower === "BEAR") { currentSpeed = baseSpeed * 1.45; container.className = "bear-mode"; statusText += "BEAR CRASH(" + Math.ceil(powerTimer/60) + "s) "; powerTimer--; if(powerTimer<=0) { activePower="NONE"; container.className=""; } }
                
                if (laserActive) { statusText += "👁️LASER(" + Math.ceil(laserTimer/60) + "s)"; laserTimer--; if(laserTimer<=0) laserActive = false; }
                statusDisplay.innerText = statusText;
                if (activePower === "BULL") statusDisplay.style.color = "#00FF66"; else if (activePower === "BEAR") statusDisplay.style.color = "#FF3333"; else statusDisplay.style.color = "#33CCFF";

                // --- ANIMACIÓN INTERPOLADA (SUAVE) DE LASER EYES ---
                let targetWidth = laserActive ? 22 : 65; 
                animatedWidthWidth += (targetWidth - animatedWidthWidth) * 0.08; // Suavizado progresivo frame a frame

                btc.velocity += btc.gravity; btc.y += btc.velocity;
                if (btc.y + btc.radius > canvas.height || btc.y - btc.radius < 0) gameOver();

                pipeTimer++;
                if (pipeTimer % 95 === 0) {
                    let topHeight = Math.floor(Math.random() * ((canvas.height - 280) - 60 + 1)) + 60;
                    pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - (topHeight + 160), passed: false });
                    if (Math.random() < 0.45) {
                        let rand = Math.random(); let itemType = (rand < 0.33) ? "BULL" : (rand < 0.66 ? "LASER" : "BEAR");
                        items.push({ x: canvas.width + 100, y: topHeight + 80, type: itemType, radius: 14 });
                    }
                }

                // Colisiones con esferas de Items (El Toro cancela al Oso)
                for (let j = items.length - 1; j >= 0; j--) {
                    items[j].x -= currentSpeed;
                    if (Math.hypot(btc.x - items[j].x, btc.y - items[j].y) < btc.radius + items[j].radius) {
                        if (items[j].type === "LASER") { laserActive = true; laserTimer = 360; playTone(480, "triangle", 0.25); }
                        else { 
                            activePower = items[j].type; powerTimer = 360; 
                            if (activePower === "BULL") { playTone(550, "sine", 0.15); container.className = "bull-mode"; }
                            else { playTone(160, "sawtooth", 0.45); container.className = "bear-mode"; }
                        }
                        items.splice(j, 1); continue;
                    }
                    if (items[j].x < -20) items.splice(j, 1);
                }

                // Colisiones y procesado de Velas de Mercado
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= currentSpeed;
                    
                    // Si es BULL MARKET, "come" las velas al tocarlas
                    if (btc.x + btc.radius > pipes[i].x && btc.x - btc.radius < pipes[i].x + animatedWidthWidth && (btc.y - btc.radius < pipes[i].top || btc.y + btc.radius > canvas.height - pipes[i].bottom)) {
                        if (activePower === "BULL") {
                            pipes.splice(i, 1); // Desaparece la vela
                            score += 2; scoreDisplay.innerText = "SCORE: " + score;
                            playTone(720, "sine", 0.08, 0.1); continue;
                        } else { gameOver(); }
                    }
                    if (pipes[i] && !pipes[i].passed && pipes[i].x + animatedWidthWidth < btc.x) {
                        pipes[i].passed = true; score += 1; scoreDisplay.innerText = "SCORE: " + score; playTone(880, "sine", 0.04);
                    }
                    if (pipes[i] && pipes[i].x + 65 < 0) pipes.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = (activePower === "BEAR") ? "#351212" : (activePower === "BULL" ? "#123512" : "#121226"); ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let j=0; j<canvas.height; j+=40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

            pipes.forEach(p => {
                ctx.fillStyle = (activePower === "BULL") ? "#00FF66" : "#FF3333";
                ctx.fillRect(p.x, 0, animatedWidthWidth, p.top); ctx.fillRect(p.x, canvas.height - p.bottom, animatedWidthWidth, p.bottom);
                ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2;
                ctx.strokeRect(p.x, 0, animatedWidthWidth, p.top); ctx.strokeRect(p.x, canvas.height - p.bottom, animatedWidthWidth, p.bottom);
            });

            items.forEach(it => {
                ctx.beginPath(); ctx.arc(it.x, it.y, it.radius, 0, Math.PI*2);
                if (it.type === "BULL") ctx.fillStyle = "#00FF66"; if (it.type === "LASER") ctx.fillStyle = "#33CCFF"; if (it.type === "BEAR") ctx.fillStyle = "#FF3333";
                ctx.fill(); ctx.strokeStyle = "#FFF"; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = "#000"; ctx.font = "bold 14px monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                let sym = it.type === "BULL" ? "▲" : it.type === "LASER" ? "🕶" : "▼"; ctx.fillText(sym, it.x, it.y);
            });

            ctx.beginPath(); ctx.arc(btc.x, btc.y, btc.radius, 0, Math.PI * 2); ctx.fillStyle = "#F2A900"; ctx.fill(); ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 20px monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("B", btc.x, btc.y + 1);
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
