name: apply-battle-patch
on:
  push:
    branches: [main]
    paths:
      - scripts/apply-battle.py
      - .github/workflows/apply-battle.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply-battle.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add choppy-bitcoin/game.js
          if git diff --cached --quiet; then
            echo "no game.js change"
          else
            git commit -m "Battle: single shield, troop lanes, LRM charge+scope, FX"
            git push
          fi
