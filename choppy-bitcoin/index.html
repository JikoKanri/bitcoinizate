<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Choppy Bitcoin | Bitcoinizate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="hud" class="hud-grid hud-4">
      <div class="stat"><span>Cash</span><b id="h-cash">$0</b></div>
      <div class="stat"><span>BTC</span><b id="h-btc">0 BTC</b></div>
      <div class="stat"><span>BTC price</span><b id="h-price">$0</b></div>
      <div class="stat hide" id="h-vt-wrap"><span>VT</span><b id="h-vt">0 VT</b></div>
      <div class="stat hide" id="h-vtpx-wrap"><span>VT price</span><b id="h-vtpx">$0</b></div>
      <div class="stat" id="h-cold-wrap">
        <span>Cold storage</span><b id="h-cold">0</b>
        <span class="sub">Multisig</span><b id="h-msig">0</b>
      </div>
      <div class="stat"><span>Laser eyes</span><b id="h-laser">0</b></div>
      <div class="stat"><span>Next halving</span><b id="h-halve">21</b></div>
      <div class="stat"><span>Halvings</span><b id="h-halves">0</b></div>
    </div>
    <div class="speed-bar">
      <span id="spd-lab" class="hide">Speed</span>
      <button type="button" data-speed="1" id="spd-1" class="spd on hide">1x</button>
      <button type="button" data-speed="2" id="spd-2" class="spd hide">2x</button>
      <button type="button" id="dca-btn" class="dca-tog hide" aria-pressed="false">DCA OFF</button>
      <span id="trend-lab" class="hide">Trend</span>
      <button type="button" id="trend-up" class="trend hide" data-trend="up">UP</button>
      <button type="button" id="trend-eq" class="trend hide" data-trend="equal">EQ</button>
      <button type="button" id="trend-dn" class="trend hide" data-trend="down">DN</button>
    </div>
    <div id="field" class="field">
      <canvas id="c"></canvas>
      <div id="clock">0:00</div>
      <p id="status" class="banner top hide"></p>
      <p id="ticker" class="banner bot hide"></p>
      <div id="trades" class="trades hide">
        <div class="row">
          <button id="buy-btc" class="buy">Buy BTC (B)</button>
          <button id="sell-btc" class="sell">Sell BTC (S)</button>
        </div>
        <div class="row hide" id="vt-row">
          <button id="buy-vt" class="buy">Buy VT (V)</button>
          <button id="sell-vt" class="sell">Sell VT (N)</button>
        </div>
      </div>
      <button id="pause-btn" class="pause hide" aria-label="Pause">||</button>
      <div id="overlay" class="overlay"></div>
    </div>
  </div>
  <script src="audio.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/JikoKanri/bitcoinizate@5289ece5fda52bcdc2711c7319ea9b9ad0be9271/choppy-bitcoin/game.js"></script>
</body>
</html>
