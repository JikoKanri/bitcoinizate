<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy · Bitcoinizate</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="stylesheet" href="/choppy-bitcoin/style.css">
  <style>
    body { margin: 0; background: #0d0d0d; color: #f3efe6; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    main { width: min(640px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 72px; }
    h1 { color: #F2A900; font-size: 22px; }
    p { line-height: 1.55; color: #d4d0c8; }
    a { color: #F2A900; }
    .lang-sw { display: flex; gap: 4px; margin: 0 0 20px; }
    .lang-sw button { min-width: 36px; min-height: 32px; border: 1px solid #3a3a40; background: transparent; color: #f3efe6; font: inherit; cursor: pointer; }
    .lang-sw button.on { border-color: #F2A900; color: #F2A900; }
  </style>
</head>
<body>
  <main>
    <div class="lang-sw">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
    <h1 data-i18n="privacyH">Privacy policy</h1>
    <p data-i18n="privacyB1"></p>
    <p data-i18n="privacyB2"></p>
    <p data-i18n="privacyB3"></p>
    <p data-i18n="privacyB4"></p>
    <p data-i18n="privacyB5"></p>
    <p data-i18n="privacyB6"></p>
    <p><a href="/">Bitcoinizate</a></p>
  </main>
  <script src="/i18n.js"></script>
</body>
</html>
